[project]
name = "bidding-conventions"
version = "0.0.0"
description = "An API to support bidding convention practice"
authors = [{name = "Jeff Watkins", email = "jeffwatkins2000@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bfgdealer>=0.0.25",
    "django>=6.0.3",
    "django-cors-headers>=4.9.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
